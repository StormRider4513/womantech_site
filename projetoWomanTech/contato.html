<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | WomanTech</title>
    <link
        href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Raleway:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contato.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div id="header"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <p class="eyebrow">Fale com a gente</p>
                <h1>Contato</h1>
                <p>Envie uma mensagem para tirar dúvidas ou saber mais sobre o WomanTech.</p>
            </div>
        </section>
        <section class="section">
            <div class="container contact-layout">
                <div class="contact-info">
                    <h2>Vamos conversar?</h2>
                    <p>Use o formulário ou entre em contato pelos canais oficiais do projeto.</p>
                    <p><strong>E-mail:</strong> <a href="mailto:womantech.fci@gmail.com">womantech.fci@gmail.com</a></p>
                    <p><strong>Instagram:</strong> <a href="https://www.instagram.com/womantech_fci" target="_blank"
                            rel="noopener noreferrer">@womantech_fci</a></p>
                </div>
                <form class="contact-form" action="https://formspree.io/f/mzzaoowb" method="POST">
                    <label for="name">Nome</label><input id="name" name="name" type="text" autocomplete="name" required>
                    <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email"
                        required>
                    <label for="subject">Assunto</label><input id="subject" name="subject" type="text" required>
                    <label for="message">Mensagem</label><textarea id="message" name="message" rows="6"
                        required></textarea>
                    <button class="button button--primary" type="submit">Enviar mensagem</button>
                </form>
            </div>
        </section>
    </main>
    <div id="footer"></div>
</body>

</html>
